<text x="69" y="483" fill="#3e5268" font-family="Arial,sans-serif" font-size="21">
 <tspan x="69" dy="0">Vom ersten Familienfenster bis zum Ausflug.</tspan>
 <tspan x="69" dy="32">Findet heraus, was zu euch und eurem Tag passt.</tspan>
</text>
